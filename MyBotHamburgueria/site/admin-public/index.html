<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyBot | Painel da Hamburgueria</title><style>:root{--g:#16a866;--dark:#092a1d;--ink:#12251d;--line:#dbe9e1;--soft:#f4faf6}*{box-sizing:border-box}body{margin:0;background:var(--soft);font-family:Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:var(--dark);border-bottom:3px solid var(--g);color:#fff;padding:18px 4vw;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-size:24px;font-weight:900}.brand small{display:block;color:#8fe8bb;font-size:12px;letter-spacing:1px}.top button{background:#fff;color:var(--dark);border:0;border-radius:12px;padding:10px 16px;font-weight:800}.wrap{max-width:1420px;margin:0 auto;padding:28px 3vw}.hero{background:linear-gradient(115deg,#092a1d,#176640);padding:28px;border-radius:22px;color:#fff;margin-bottom:22px}.hero h1{margin:0;font-size:31px}.hero p{margin:9px 0 0;color:#c9f5da}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}.tabs button{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 8px;font-weight:800}.tabs button.on{background:var(--dark);color:#fff}.view{display:none;background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px}.view.on{display:block}.eyebrow{color:var(--g);font-weight:900;font-size:12px;letter-spacing:1px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{border:1px solid var(--line);border-radius:14px;padding:17px}.card h3{margin:0 0 12px}.item{padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{color:#61736a}.ok{color:#8fe8bb;font-weight:800}.bad{color:#b42318;font-weight:800}label{font-weight:800;display:block;margin:10px 0 5px}input,select,textarea{width:100%;border:1px solid #b9ccc0;border-radius:9px;padding:10px;background:#fff}textarea{min-height:82px;resize:vertical}.btn{border:0;border-radius:9px;background:var(--g);color:#fff;padding:10px 14px;font-weight:800}.btn.light{background:#e7f5ec;color:#087944}.btn.danger{background:#fff0f0;color:#b42318}.login{max-width:420px;margin:12vh auto;background:#fff;padding:28px;border-radius:20px;border:1px solid var(--line);box-shadow:0 15px 50px #0a2a1d18}.login h1{margin-top:0}.notice{min-height:20px;margin:12px 0;color:#b42318}.thumb{width:76px;height:58px;object-fit:cover;border-radius:8px;background:#edf4ef}.empty{padding:30px;text-align:center;color:#61736a}.price{font-weight:900}.hidden{display:none!important}@media(max-width:760px){.top{padding:14px}.brand{font-size:21px}.wrap{padding:18px 12px}.tabs{display:flex;overflow:auto;grid-template-columns:none}.tabs button{min-width:145px}.grid{grid-template-columns:1fr}.view{padding:18px}.hero{padding:22px}.hero h1{font-size:25px}}</style></head><body><section id="login" class="login"><div class="eyebrow">MYBOT</div><h1>Painel da hamburgueria</h1><p class="muted">Digite a senha para abrir esta aba.</p><form id="login-form"><label>Senha</label><input id="senha" type="password" autocomplete="current-password" required><button class="btn" style="width:100%;margin-top:16px">Entrar no painel</button><div id="login-msg" class="notice"></div></form></section><main id="app" class="hidden"><header class="top"><div class="brand">MyBot<small id="empresa">MINHA HAMBURGUERIA</small></div><div><span id="status" class="ok">● Carregando</span> <button id="sair">Sair</button></div></header><div class="wrap"><section class="hero"><div class="eyebrow">CENTRAL DE OPERAÇÕES</div><h1>Pedidos e cardápio da sua hamburgueria</h1><p>Cadastre e controle Hambúrgueres, Combos, Complementos e Bebidas em um só lugar.</p></section><nav class="tabs" id="tabs"></nav><section id="views"></section></div></main><script src="./app.js"></script></body></html
